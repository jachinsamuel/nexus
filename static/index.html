<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS</title>
    <!-- Modern Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
    <!-- Ambient Atmospheric Glow (Pure Dark & Cyan, Zero Green) -->
    <div class="ambient-mesh" id="ambient-mesh"></div>

    <div class="app-layout">
        <!-- Main Stage -->
        <main class="app-stage" id="app-stage">
            <!-- Center Interactive Spline 3D Robot & Always Greeting -->
            <div class="jarvis-hero-container" id="jarvis-hero-container">
                <div class="spline-robot-wrapper" id="spline-robot-wrapper" onclick="toggleVoiceMode()" title="NEXUS (Click or Press Spacebar to Talk)">
                    <iframe src="spline_robot.html" id="spline-robot-iframe" frameborder="0" allow="fullscreen"></iframe>
                </div>

                <!-- Always Greets the User -->
                <h1 class="nexus-greeting" id="nexus-greeting">How can I help?</h1>
            </div>

            <!-- Conversation & Response Stream (Shown when active) -->
            <div class="chat-thread-container" id="chat-thread-container" style="display: none;">
                <!-- User Query Card -->
                <div class="thread-item user-query" id="user-query-card">
                    <div class="thread-avatar">You</div>
                    <div class="thread-content" id="user-query-text"></div>
                </div>

                <!-- Assistant Response Card -->
                <div class="thread-item assistant-reply" id="assistant-reply-card">
                    <div class="thread-header">
                        <div class="assistant-meta">
                            <span class="assistant-name">NEXUS</span>
                            <span class="assistant-status" id="reply-status-indicator"></span>
                        </div>
                        <div class="reply-actions">
                            <button class="mini-tool-btn" onclick="copyResponseText()" title="Copy">
                                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                                <span>Copy</span>
                            </button>
                            <button class="mini-tool-btn" onclick="speakCurrentResponse()" title="Speak">
                                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
                                <span>Speak</span>
                            </button>
                            <button class="mini-tool-btn" onclick="closeChatThread()" title="Close">
                                &times;
                            </button>
                        </div>
                    </div>
                    <div class="thread-body" id="stream-output-text"></div>
                </div>
            </div>
        </main>

        <!-- Minimal Bottom Prompt Dock -->
        <footer class="app-prompt-dock">
            <div class="prompt-capsule">
                <button class="capsule-mic-btn" id="btn-voice-toggle" onclick="toggleVoiceMode()" title="Voice Mode">
                    <svg class="mic-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                        <line x1="12" y1="19" x2="12" y2="23"/>
                        <line x1="8" y1="23" x2="16" y2="23"/>
                    </svg>
                </button>

                <form class="prompt-form" id="prompt-form" onsubmit="handlePromptSubmit(event)">
                    <input 
                        type="text" 
                        id="prompt-input" 
                        placeholder="Ask NEXUS anything..." 
                        autocomplete="off"
                        spellcheck="false"
                    >
                    <button type="submit" class="capsule-send-btn" id="btn-submit" title="Send">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </form>

                <button class="capsule-settings-btn" id="btn-settings" onclick="openSettingsModal()" title="Settings">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                    </svg>
                </button>
            </div>
        </footer>
    </div>

    <!-- Clean Settings Modal -->
    <div class="modal-overlay" id="settings-modal" style="display: none;">
        <div class="modal-card">
            <div class="modal-header">
                <h3 class="modal-title">Settings</h3>
                <button class="modal-close-btn" onclick="closeSettingsModal()">&times;</button>
            </div>

            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">AI Provider</label>
                    <select class="form-select" id="provider-select" onchange="onProviderChanged()">
                        <option value="ollama">Ollama (Local / Offline)</option>
                        <option value="openai">OpenAI (GPT-4o)</option>
                        <option value="anthropic">Anthropic (Claude 3.5)</option>
                        <option value="groq">Groq (Ultra-Fast Llama)</option>
                    </select>
                </div>

                <div class="form-group" id="api-key-group" style="display: none;">
                    <label class="form-label">API Key</label>
                    <input type="password" class="form-input" id="api-key-input" placeholder="sk-...">
                </div>

                <div class="form-group">
                    <label class="form-label">Model</label>
                    <input type="text" class="form-input" id="model-input" value="qwen2.5-coder:3b" placeholder="e.g. qwen2.5-coder:3b, gpt-4o">
                </div>
            </div>

            <div class="modal-footer">
                <span class="save-feedback" id="save-status-msg"></span>
                <button class="btn-cancel" onclick="closeSettingsModal()">Cancel</button>
                <button class="btn-save" onclick="saveEngineSettings()">Save</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
