<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS // Autonomous Arc Core</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="viewport">
        <!-- Minimal Top Navigation -->
        <header class="topbar">
            <div class="brand">
                <span class="status-indicator"></span>
                <span class="brand-title">N E X U S</span>
            </div>
            
            <div class="telemetry-pill" id="telemetry-pill" onclick="toggleSettingsDrawer()">
                <span class="telemetry-item" id="hdr-cpu">CPU --%</span>
                <span class="sep">•</span>
                <span class="telemetry-item" id="hdr-ram">RAM --GB</span>
                <span class="sep">•</span>
                <span class="settings-gear">⚙</span>
            </div>
        </header>

        <!-- Main Focal Workspace: Sleek Ultra-High-End Arc Core -->
        <main class="reactor-workspace">
            <div class="arc-container">
                <!-- Corner HUD Reticles matching reference image -->
                <div class="hud-corner top-left"></div>
                <div class="hud-corner top-right"></div>
                <div class="hud-corner bottom-left"></div>
                <div class="hud-corner bottom-right"></div>

                <div class="neon-ring-outer"></div>
                <div class="neon-ring-glow"></div>

                <div class="arc-core-wrapper">
                    <canvas id="arc-canvas" width="400" height="400"></canvas>
                    <div class="arc-glass-core">
                        <span class="arc-brand-text">NEXUS</span>
                    </div>
                </div>
            </div>

            <div class="status-display">
                <div class="status-state" id="nexus-state">STANDBY</div>
                <div class="status-transcript" id="nexus-transcript">Click the Arc Reactor or press space to initiate voice mode</div>
            </div>

            <!-- Floating Answer & Stream Box -->
            <div class="response-stream-box" id="response-stream-box" style="display: none;">
                <div class="stream-header">
                    <span class="stream-role" id="stream-role">NEXUS // RESPONSE CORE</span>
                    <div class="stream-actions">
                        <button class="close-stream-btn" onclick="closeStreamResponse()" title="Close Box">&times;</button>
                    </div>
                </div>
                <div class="stream-text" id="stream-text"></div>
            </div>
        </main>

        <!-- Minimalist Floating Control Bar -->
        <footer class="control-footer">
            <form class="cmd-form" id="cmd-form">
                <button type="button" class="mic-btn" id="mic-trigger" title="Toggle Voice Activation">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
                </button>
                <input type="text" id="cmd-input" placeholder="Ask NEXUS a question or execute command..." autocomplete="off" required>
                <button type="submit" class="send-btn" title="Send Command">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </form>
        </footer>
    </div>

    <!-- Hidden Settings Drawer -->
    <div class="settings-drawer" id="settings-drawer" style="display: none;">
        <div class="drawer-header">
            <span>ENGINE CONFIGURATION</span>
            <button class="drawer-close" onclick="toggleSettingsDrawer()">&times;</button>
        </div>
        <div class="drawer-body">
            <label class="field-label">AI Provider</label>
            <select id="provider-select" class="clean-select">
                <option value="ollama" selected>Ollama (Local: qwen2.5-coder:3b)</option>
                <option value="nvidia">NVIDIA NIM Cloud API</option>
                <option value="gemini">Google Gemini API</option>
                <option value="openai">OpenAI API (GPT-4o)</option>
            </select>

            <div id="key-field-group" style="display: none; margin-top: 12px;">
                <label class="field-label">API Key</label>
                <input type="password" id="api-key-input" class="clean-input" placeholder="API Key (e.g. nvapi-...)">
            </div>

            <label class="field-label" style="margin-top: 12px;">Model Name</label>
            <input type="text" id="model-input" class="clean-input" value="qwen2.5-coder:3b">

            <button class="save-config-btn" onclick="saveEngineConfig()">Save Configuration</button>
            <div id="save-status-msg" class="save-status-msg" style="display: none;"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
